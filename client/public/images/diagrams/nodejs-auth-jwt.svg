<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" role="img" aria-labelledby="t d">
  <title id="t">Login and protected routes</title>
  <desc id="d">The user logs in, bcrypt compares the password, the server signs a JWT and sets it in an httpOnly cookie, and later requests are verified.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#86efac"/></marker></defs>
  <rect width="720" height="246" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#86efac" text-anchor="middle">Login and protected routes</text>
  <rect x="26.0" y="60.0" width="106.4" height="104.0" rx="10" fill="#0f172a" stroke="#86efac" stroke-width="1.6"/>
  <text x="79.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">POST /login</text>
  <text x="79.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">username +</text>
  <text x="79.2" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">password</text>
  <line x1="135.4" y1="112.0" x2="163.4" y2="112.0" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="166.4" y="60.0" width="106.4" height="104.0" rx="10" fill="#0f172a" stroke="#86efac" stroke-width="1.6"/>
  <text x="219.6" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">bcrypt.compare</text>
  <text x="219.6" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">checks the</text>
  <text x="219.6" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">hash</text>
  <line x1="275.8" y1="112.0" x2="303.8" y2="112.0" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="306.8" y="60.0" width="106.4" height="104.0" rx="10" fill="#0f172a" stroke="#86efac" stroke-width="1.6"/>
  <text x="360.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">jwt.sign</text>
  <text x="360.0" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">makes the</text>
  <text x="360.0" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">token</text>
  <line x1="416.2" y1="112.0" x2="444.2" y2="112.0" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="447.2" y="60.0" width="106.4" height="104.0" rx="10" fill="#0f172a" stroke="#86efac" stroke-width="1.6"/>
  <text x="500.4" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">httpOnly</text>
  <text x="500.4" y="105.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">cookie</text>
  <text x="500.4" y="125.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">browser stores</text>
  <text x="500.4" y="140.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">it</text>
  <line x1="556.6" y1="112.0" x2="584.6" y2="112.0" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="587.6" y="60.0" width="106.4" height="104.0" rx="10" fill="#0f172a" stroke="#86efac" stroke-width="1.6"/>
  <text x="640.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">protect()</text>
  <text x="640.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">jwt.verify on</text>
  <text x="640.8" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">each request</text>
  <text x="360.0" y="190.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Passwords are stored only as bcrypt hashes. The secret key lives in .env,</text>
  <text x="360.0" y="206.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">never in the code.</text>
</svg>
