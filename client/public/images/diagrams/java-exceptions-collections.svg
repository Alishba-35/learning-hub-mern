<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 229" width="720" height="229" role="img" aria-labelledby="t d">
  <title id="t">try / catch / finally</title>
  <desc id="d">Code in try runs; if an exception is thrown catch handles it; finally always runs.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker></defs>
  <rect width="720" height="229" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fb923c" text-anchor="middle">try / catch / finally</text>
  <rect x="26.0" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="96.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">try</text>
  <text x="96.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">risky code runs</text>
  <text x="96.8" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">here</text>
  <line x1="170.5" y1="103.5" x2="198.5" y2="103.5" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="201.5" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="272.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">exception?</text>
  <text x="272.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">if one is thrown,</text>
  <text x="272.2" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">jump to catch</text>
  <line x1="346.0" y1="103.5" x2="374.0" y2="103.5" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="377.0" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="447.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">catch</text>
  <text x="447.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">handle the error</text>
  <line x1="521.5" y1="103.5" x2="549.5" y2="103.5" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="552.5" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="623.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">finally</text>
  <text x="623.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">always runs at the</text>
  <text x="623.2" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">end</text>
  <text x="360.0" y="173.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Without catch, an uncaught exception stops the program. finally runs whether</text>
  <text x="360.0" y="189.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">or not an error happened.</text>
</svg>
