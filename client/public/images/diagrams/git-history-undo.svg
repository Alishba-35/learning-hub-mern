<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" role="img" aria-labelledby="t d">
  <title id="t">Where each undo command works</title>
  <desc id="d">Restore discards working edits, restore --staged unstages, and revert adds a new commit that undoes an old one.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fdba74"/></marker></defs>
  <rect width="720" height="284" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fdba74" text-anchor="middle">Where each undo command works</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Pick the command by where the change is</text>
  <rect x="40.0" y="86.0" width="180.0" height="44.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="130.0" y="114.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fdba74" text-anchor="middle">Working dir</text>
  <rect x="270.0" y="86.0" width="180.0" height="44.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="360.0" y="114.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fdba74" text-anchor="middle">Staging area</text>
  <rect x="500.0" y="86.0" width="180.0" height="44.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="590.0" y="114.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#fdba74" text-anchor="middle">Repository</text>
  <line x1="222.0" y1="108.0" x2="268.0" y2="108.0" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245.0" y="100.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">add</text>
  <line x1="452.0" y1="108.0" x2="498.0" y2="108.0" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475.0" y="100.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">commit</text>
  <line x1="130.0" y1="132.0" x2="130.0" y2="168.0" stroke="#f87171" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40.0" y="170.0" width="180.0" height="62.0" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="1.6"/>
  <text x="130.0" y="194.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">git restore file</text>
  <text x="130.0" y="222.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">throw away edits</text>
  <line x1="360.0" y1="132.0" x2="360.0" y2="168.0" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="270.0" y="170.0" width="180.0" height="62.0" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="360.0" y="194.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">git restore --staged</text>
  <text x="360.0" y="209.5" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">file</text>
  <text x="360.0" y="222.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">unstage, keep edits</text>
  <line x1="590.0" y1="132.0" x2="590.0" y2="168.0" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500.0" y="170.0" width="180.0" height="62.0" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="590.0" y="194.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">git revert HEAD</text>
  <text x="590.0" y="222.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">undo with a new commit</text>
  <text x="360.0" y="262.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">git log --oneline shows the history so you can find what to undo.</text>
</svg>
