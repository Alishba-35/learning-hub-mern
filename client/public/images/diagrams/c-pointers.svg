<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" role="img" aria-labelledby="t d">
  <title id="t">A pointer holds an address</title>
  <desc id="d">Variable x holds 10 at an address; pointer p holds that address and points to x.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker></defs>
  <rect width="720" height="288" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#a5b4fc" text-anchor="middle">A pointer holds an address</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">int x = 10;   int *p = &amp;x;   (addresses are examples)</text>
  <text x="150.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">x</text>
  <rect x="70.0" y="110.0" width="160.0" height="56.0" rx="6" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="150.0" y="146.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">10</text>
  <text x="150.0" y="188.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">address 0x1000</text>
  <text x="550.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">p</text>
  <rect x="450.0" y="110.0" width="200.0" height="56.0" rx="6" fill="#0f172a" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="550.0" y="146.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">0x1000</text>
  <text x="550.0" y="188.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">address 0x1008</text>
  <line x1="446.0" y1="138.0" x2="236.0" y2="138.0" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arr)"/>
  <text x="341.0" y="128.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">points to</text>
  <text x="360.0" y="232.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">&amp;x gives the address of x. *p goes to that address, so *p = 25; changes x to</text>
  <text x="360.0" y="248.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">25.</text>
</svg>
