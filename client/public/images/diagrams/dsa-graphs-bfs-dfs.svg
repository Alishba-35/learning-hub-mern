  <text x="360.0" y="408.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">DFS from A would go A, B, D, E, F, C: it goes deep first. Both cost O(V + E).</text>
