<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t d">
  <title id="t">Props flow from parent to child</title>
  <desc id="d">App renders two Greeting components, passing name Sara and name Bilal as props, producing Hello Sara and Hello Bilal.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker></defs>
  <rect width="720" height="392" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#67e8f9" text-anchor="middle">Props flow from parent to child</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">One component, used twice with different props</text>
  <rect x="260.0" y="82.0" width="200.0" height="42.0" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="360.0" y="109.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">&lt;App /&gt;</text>
  <line x1="360.0" y1="126.0" x2="190.0" y2="186.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="112.0" y="160.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">props</text>
  <rect x="70.0" y="188.0" width="240.0" height="58.0" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="190.0" y="212.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">&lt;Greeting /&gt;</text>
  <text x="190.0" y="234.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">name=&quot;Sara&quot;</text>
  <line x1="190.0" y1="248.0" x2="190.0" y2="286.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="90.0" y="288.0" width="200.0" height="40.0" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="190.0" y="314.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Hello, Sara!</text>
  <line x1="360.0" y1="126.0" x2="530.0" y2="186.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="608.0" y="160.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">props</text>
  <rect x="410.0" y="188.0" width="240.0" height="58.0" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="530.0" y="212.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">&lt;Greeting /&gt;</text>
  <text x="530.0" y="234.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">name=&quot;Bilal&quot;</text>
  <line x1="530.0" y1="248.0" x2="530.0" y2="286.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="430.0" y="288.0" width="200.0" height="40.0" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="530.0" y="314.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Hello, Bilal!</text>
  <text x="360.0" y="358.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Data goes down only. A child reads its props but never changes them</text>
  <text x="360.0" y="374.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">(read-only).</text>
</svg>
