<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 251" width="720" height="251" role="img" aria-labelledby="t d">
  <title id="t">The order a query really runs</title>
  <desc id="d">FROM picks the table, WHERE filters rows, SELECT chooses columns, ORDER BY sorts, LIMIT trims.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker></defs>
  <rect width="720" height="251" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#5eead4" text-anchor="middle">The order a query really runs</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">You write SELECT first, but the database starts at FROM.</text>
  <rect x="26.0" y="82.0" width="106.4" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="79.2" y="110.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">FROM</text>
  <text x="79.2" y="129.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">pick the table</text>
  <line x1="135.4" y1="125.5" x2="163.4" y2="125.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="166.4" y="82.0" width="106.4" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="219.6" y="110.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">WHERE</text>
  <text x="219.6" y="129.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">keep matching</text>
  <text x="219.6" y="145.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">rows</text>
  <line x1="275.8" y1="125.5" x2="303.8" y2="125.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="306.8" y="82.0" width="106.4" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="360.0" y="110.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">SELECT</text>
  <text x="360.0" y="129.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">choose the</text>
  <text x="360.0" y="145.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">columns</text>
  <line x1="416.2" y1="125.5" x2="444.2" y2="125.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="447.2" y="82.0" width="106.4" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="500.4" y="110.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">ORDER BY</text>
  <text x="500.4" y="129.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">sort the</text>
  <text x="500.4" y="145.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">result</text>
  <line x1="556.6" y1="125.5" x2="584.6" y2="125.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="587.6" y="82.0" width="106.4" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="640.8" y="110.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">LIMIT</text>
  <text x="640.8" y="129.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">keep the first</text>
  <text x="640.8" y="145.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">N rows</text>
  <text x="360.0" y="195.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Knowing this order explains why a column alias works in ORDER BY but not in</text>
  <text x="360.0" y="211.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">WHERE.</text>
</svg>
