<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d">
  <title id="t">The pull request workflow</title>
  <desc id="d">Create a branch, commit, push, open a pull request, get a review, and merge into main.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fdba74"/></marker></defs>
  <rect width="720" height="330" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fdba74" text-anchor="middle">The pull request workflow</text>
  <rect x="26.0" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="96.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">1. Branch</text>
  <text x="96.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">git switch -c</text>
  <text x="96.8" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">feature</text>
  <line x1="170.5" y1="103.5" x2="198.5" y2="103.5" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="201.5" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="272.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">2. Commit</text>
  <text x="272.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">save your work</text>
  <line x1="346.0" y1="103.5" x2="374.0" y2="103.5" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="377.0" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="447.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">3. Push</text>
  <text x="447.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">git push origin</text>
  <text x="447.8" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">feature</text>
  <line x1="521.5" y1="103.5" x2="549.5" y2="103.5" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="552.5" y="60.0" width="141.5" height="87.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="623.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">4. Open PR</text>
  <text x="623.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">on GitHub</text>
  <line x1="623.2" y1="150.0" x2="623.2" y2="173.0" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <line x1="623.2" y1="173.0" x2="96.8" y2="173.0" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="96.8" y1="173.0" x2="96.8" y2="193.0" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="26.0" y="193.0" width="141.5" height="72.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="96.8" y="221.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">5. Review</text>
  <text x="96.8" y="240.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">teammates comment</text>
  <line x1="170.5" y1="229.0" x2="198.5" y2="229.0" stroke="#fdba74" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="201.5" y="193.0" width="141.5" height="72.0" rx="10" fill="#0f172a" stroke="#fdba74" stroke-width="1.6"/>
  <text x="272.2" y="221.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">6. Merge</text>
  <text x="272.2" y="240.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">into main</text>
  <text x="360.0" y="291.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">main stays safe: only reviewed work is merged.</text>
</svg>
