<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" role="img" aria-labelledby="t d">
  <title id="t">From source code to a running program</title>
  <desc id="d">Main.java is compiled by javac into Main.class bytecode, which the JVM runs to produce output.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker></defs>
  <rect width="720" height="244" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fb923c" text-anchor="middle">From source code to a running program</text>
  <rect x="26.0" y="60.0" width="106.4" height="102.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="79.2" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Main.java</text>
  <text x="79.2" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">You write the</text>
  <text x="79.2" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">source code</text>
  <line x1="135.4" y1="111.0" x2="163.4" y2="111.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="166.4" y="60.0" width="106.4" height="102.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="219.6" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">javac</text>
  <text x="219.6" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Compiler</text>
  <text x="219.6" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">checks and</text>
  <text x="219.6" y="138.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">translates</text>
  <line x1="275.8" y1="111.0" x2="303.8" y2="111.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="306.8" y="60.0" width="106.4" height="102.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="360.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Main.class</text>
  <text x="360.0" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Bytecode, same</text>
  <text x="360.0" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">on every OS</text>
  <line x1="416.2" y1="111.0" x2="444.2" y2="111.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="447.2" y="60.0" width="106.4" height="102.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="500.4" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">JVM</text>
  <text x="500.4" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Java Virtual</text>
  <text x="500.4" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Machine runs</text>
  <text x="500.4" y="138.6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">it</text>
  <line x1="556.6" y1="111.0" x2="584.6" y2="111.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="587.6" y="60.0" width="106.4" height="102.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="640.8" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Output</text>
  <text x="640.8" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Hello,</text>
  <text x="640.8" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Learning Hub!</text>
  <text x="360.0" y="188.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Write once, run anywhere: the JVM on each operating system understands the</text>
  <text x="360.0" y="204.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">same bytecode.</text>
</svg>
