  <text x="360.0" y="286.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">A variable is a name that points to a value. The type belongs to the value, so</text>
  <text x="360.0" y="302.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">a name can point to another type later.</text>
