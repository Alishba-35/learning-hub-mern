<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" width="720" height="316" role="img" aria-labelledby="t d">
  <title id="t">map() turns data into elements with keys</title>
  <desc id="d">Three course objects with ids 1, 2, 3 are mapped to li elements, each with key equal to its id.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker></defs>
  <rect width="720" height="316" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#67e8f9" text-anchor="middle">map() turns data into elements with keys</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Each item needs a unique, stable key (use the id)</text>
  <text x="150.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#67e8f9" text-anchor="middle">courses array</text>
  <text x="530.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#67e8f9" text-anchor="middle">rendered list items</text>
  <text x="335.0" y="88.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="middle">map</text>
  <rect x="30.0" y="100.0" width="240.0" height="44.0" rx="6" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="150.0" y="127.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">{ id: 1, title: &quot;HTML&quot; }</text>
  <line x1="274.0" y1="122.0" x2="384.0" y2="122.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="388.0" y="100.0" width="304.0" height="44.0" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="400.0" y="119.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start">&lt;li key={1}&gt;</text>
  <text x="400.0" y="136.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">HTML (done)</text>
  <rect x="30.0" y="156.0" width="240.0" height="44.0" rx="6" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="150.0" y="183.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">{ id: 2, title: &quot;CSS&quot; }</text>
  <line x1="274.0" y1="178.0" x2="384.0" y2="178.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="388.0" y="156.0" width="304.0" height="44.0" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="400.0" y="175.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start">&lt;li key={2}&gt;</text>
  <text x="400.0" y="192.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">CSS (pending)</text>
  <rect x="30.0" y="212.0" width="240.0" height="44.0" rx="6" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="150.0" y="239.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">{ id: 3, title: &quot;React&quot; }</text>
  <line x1="274.0" y1="234.0" x2="384.0" y2="234.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="388.0" y="212.0" width="304.0" height="44.0" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="400.0" y="231.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start">&lt;li key={3}&gt;</text>
  <text x="400.0" y="248.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">React (pending)</text>
  <text x="360.0" y="282.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Keys let React tell items apart when the list changes. Avoid the array index</text>
  <text x="360.0" y="298.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">as key if the list can be reordered or filtered.</text>
</svg>
