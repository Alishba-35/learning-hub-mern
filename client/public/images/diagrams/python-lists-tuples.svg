  <rect x="264.0" y="70.0" width="96.0" height="48.0" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="312.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">20</text>
  <text x="312.0" y="140.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="middle">1</text>
  <text x="312.0" y="160.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">-3</text>
  <rect x="360.0" y="70.0" width="96.0" height="48.0" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="408.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">30</text>
  <text x="408.0" y="140.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="middle">2</text>
  <text x="408.0" y="160.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">-2</text>
  <rect x="456.0" y="70.0" width="96.0" height="48.0" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="504.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">40</text>
  <text x="504.0" y="140.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="middle">3</text>
  <text x="504.0" y="160.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">-1</text>
  <text x="156.0" y="140.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#60a5fa" text-anchor="end">index</text>
  <text x="156.0" y="160.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">negative</text>
  <text x="360.0" y="192.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">scores[-1] is the last item (40). Tuples look the same but cannot be changed</text>
