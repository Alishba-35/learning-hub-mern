<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t d">
  <title id="t">A list and its indexes</title>
  <desc id="d">A list with 10, 20, 30, 40 at indexes 0 to 3 and also -4 to -1 counting from the end.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs>
  <rect width="720" height="250" rx="14" fill="#1e293b" stroke="#334155"/>
