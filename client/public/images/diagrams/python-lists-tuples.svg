  <rect x="168.0" y="70.0" width="96.0" height="48.0" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="216.0" y="100.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">10</text>
  <text x="216.0" y="140.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="middle">0</text>
