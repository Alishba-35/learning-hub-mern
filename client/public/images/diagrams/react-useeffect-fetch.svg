<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
  <title id="t">When does useEffect run?</title>
  <desc id="d">Timeline of render, screen update, then effect, plus a table of three dependency array forms.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#67e8f9"/></marker></defs>
  <rect width="720" height="352" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#67e8f9" text-anchor="middle">When does useEffect run?</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">The effect runs after React has updated the screen</text>
  <rect x="30.0" y="86.0" width="190.0" height="58.0" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="125.0" y="112.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">1. Render</text>
  <text x="125.0" y="132.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Component returns JSX</text>
  <line x1="223.0" y1="115.0" x2="257.0" y2="115.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="260.0" y="86.0" width="190.0" height="58.0" rx="10" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="355.0" y="112.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">2. Screen updates</text>
  <text x="355.0" y="132.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">React updates the page</text>
  <line x1="453.0" y1="115.0" x2="487.0" y2="115.0" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="490.0" y="86.0" width="190.0" height="58.0" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="1.6"/>
  <text x="585.0" y="112.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">3. Effect runs</text>
  <text x="585.0" y="132.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">your useEffect code</text>
  <text x="360.0" y="170.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Dependency array decides when it runs again</text>
  <rect x="60.0" y="184.0" width="250.0" height="32.0" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="185.0" y="205.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">useEffect(fn)</text>
  <rect x="310.0" y="184.0" width="350.0" height="32.0" rx="4" fill="#162033" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="485.0" y="205.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">after every render</text>
  <rect x="60.0" y="220.0" width="250.0" height="32.0" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="185.0" y="241.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">useEffect(fn, [])</text>
  <rect x="310.0" y="220.0" width="350.0" height="32.0" rx="4" fill="#162033" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="485.0" y="241.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">once, after the first render</text>
  <rect x="60.0" y="256.0" width="250.0" height="32.0" rx="4" fill="#0f172a" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="185.0" y="277.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="700" fill="#fbbf24" text-anchor="middle">useEffect(fn, [count])</text>
  <rect x="310.0" y="256.0" width="350.0" height="32.0" rx="4" fill="#162033" stroke="#67e8f9" stroke-width="1.6"/>
  <text x="485.0" y="277.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">first render, then when count changes</text>
  <text x="360.0" y="318.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Cleanup (the returned function) runs before the effect runs again and when the</text>
  <text x="360.0" y="334.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">component is removed.</text>
</svg>
