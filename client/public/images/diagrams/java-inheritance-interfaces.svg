<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 314" width="720" height="314" role="img" aria-labelledby="t d">
  <title id="t">Inheritance and interfaces</title>
  <desc id="d">Dog and Cat extend Animal; an interface Pet can be implemented by them.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker></defs>
  <rect width="720" height="314" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fb923c" text-anchor="middle">Inheritance and interfaces</text>
  <rect x="220.0" y="60.0" width="160.0" height="42.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="300.0" y="86.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Animal</text>
  <line x1="300.0" y1="104.0" x2="213.0" y2="172.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="138.0" y="174.0" width="150.0" height="56.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="213.0" y="198.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Dog</text>
  <text x="213.0" y="218.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">+ bark()</text>
  <line x1="300.0" y1="104.0" x2="387.0" y2="172.0" stroke="#fb923c" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="312.0" y="174.0" width="150.0" height="56.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="387.0" y="198.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Cat</text>
  <text x="387.0" y="218.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">+ meow()</text>
  <text x="300.0" y="160.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">extends</text>
  <rect x="530.0" y="60.0" width="160.0" height="52.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="610.0" y="84.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Pet</text>
  <text x="610.0" y="102.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">interface</text>
  <line x1="610.0" y1="114.0" x2="610.0" y2="202.0" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="610.0" y1="202.0" x2="466.0" y2="202.0" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="620.0" y="150.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="start">implements</text>
  <text x="360.0" y="258.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">A subclass gets the fields and methods of its parent. A class can implement</text>
  <text x="360.0" y="274.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">many interfaces.</text>
