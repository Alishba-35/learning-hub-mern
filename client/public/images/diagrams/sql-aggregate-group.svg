<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 212" width="720" height="212" role="img" aria-labelledby="t d">
  <title id="t">GROUP BY: many rows become one row per group</title>
  <desc id="d">Rows are grouped by city and AVG(marks) gives one value per city.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker></defs>
  <rect width="720" height="212" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#5eead4" text-anchor="middle">GROUP BY: many rows become one row per group</text>
  <rect x="26.0" y="60.0" width="200.0" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="126.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Rows</text>
  <text x="126.0" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Ali Lahore 80 / Sara Karachi</text>
  <text x="126.0" y="123.1" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">92 / Omar Lahore 60</text>
  <line x1="229.0" y1="103.5" x2="257.0" y2="103.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="260.0" y="60.0" width="200.0" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="360.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">GROUP BY city</text>
  <text x="360.0" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Lahore: 80, 60 / Karachi: 92</text>
  <line x1="463.0" y1="103.5" x2="491.0" y2="103.5" stroke="#5eead4" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="494.0" y="60.0" width="200.0" height="87.0" rx="10" fill="#0f172a" stroke="#5eead4" stroke-width="1.6"/>
  <text x="594.0" y="88.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">AVG(marks)</text>
  <text x="594.0" y="107.5" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Lahore: 70 / Karachi: 92</text>
  <text x="360.0" y="173.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">SELECT city, AVG(marks) FROM students GROUP BY city;</text>
</svg>
