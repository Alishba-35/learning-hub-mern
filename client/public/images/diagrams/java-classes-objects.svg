  <text x="44.0" y="134.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="start">int speed;</text>
  <line x1="40.0" y1="146.0" x2="270.0" y2="146.0" stroke="#334155" stroke-width="1"/>
