  <text x="374.0" y="258.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">color = &quot;black&quot; speed = 60</text>
  <line x1="284.0" y1="131.0" x2="356.0" y2="243.0" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
