  <text x="374.0" y="106.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">color = &quot;red&quot;   speed = 80</text>
  <line x1="284.0" y1="131.0" x2="356.0" y2="91.0" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <rect x="360.0" y="136.0" width="330.0" height="62.0" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="374.0" y="160.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#fb923c" text-anchor="start">car2</text>
  <text x="374.0" y="182.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#e2e8f0" text-anchor="start">color = &quot;blue&quot;  speed = 120</text>
  <line x1="284.0" y1="131.0" x2="356.0" y2="167.0" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <rect x="360.0" y="212.0" width="330.0" height="62.0" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
