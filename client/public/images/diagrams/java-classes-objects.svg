  <text x="44.0" y="184.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="start">void brake()</text>
  <rect x="360.0" y="60.0" width="330.0" height="62.0" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
