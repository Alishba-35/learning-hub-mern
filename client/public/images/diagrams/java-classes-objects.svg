<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="720" height="362" role="img" aria-labelledby="t d">
  <title id="t">One class, many objects</title>
  <desc id="d">A Car class with color and speed fields and three car objects with different values.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker></defs>
  <rect width="720" height="362" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#fb923c" text-anchor="middle">One class, many objects</text>
  <rect x="30.0" y="60.0" width="250.0" height="142.0" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.6"/>
  <text x="155.0" y="84.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle">class Car</text>
  <line x1="40.0" y1="94.0" x2="270.0" y2="94.0" stroke="#334155" stroke-width="1"/>
