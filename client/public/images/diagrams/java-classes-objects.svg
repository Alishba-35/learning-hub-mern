  <text x="360.0" y="306.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">The class is the blueprint. Each object made with new Car() keeps its own</text>
  <text x="360.0" y="322.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">values.</text>
