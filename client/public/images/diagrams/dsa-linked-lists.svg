<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" width="720" height="398" role="img" aria-labelledby="t d">
  <title id="t">Nodes joined by next links</title>
  <desc id="d">Three nodes 10, 20, 30 joined by next pointers with head at the first node, and a second row where node 10 now links straight to 30.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6ee7b7"/></marker></defs>
  <rect width="720" height="398" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#6ee7b7" text-anchor="middle">Nodes joined by next links</text>
  <text x="360.0" y="58.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Each node: a value and a link to the next node</text>
  <text x="60.0" y="104.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">head</text>
  <line x1="60.0" y1="110.0" x2="100.0" y2="136.0" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="110.0" y="122.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.6"/>
  <line x1="176.0" y1="122.0" x2="176.0" y2="168.0" stroke="#334155" stroke-width="1.4"/>
  <text x="143.0" y="151.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">10</text>
  <circle cx="198.0" cy="145.0" r="4" fill="#6ee7b7" fill-opacity="1" stroke="#6ee7b7" stroke-width="2"/>
  <line x1="198.0" y1="145.0" x2="301.0" y2="145.0" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="305.0" y="122.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.6"/>
  <line x1="371.0" y1="122.0" x2="371.0" y2="168.0" stroke="#334155" stroke-width="1.4"/>
  <text x="338.0" y="151.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">20</text>
  <circle cx="393.0" cy="145.0" r="4" fill="#6ee7b7" fill-opacity="1" stroke="#6ee7b7" stroke-width="2"/>
  <line x1="393.0" y1="145.0" x2="496.0" y2="145.0" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500.0" y="122.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.6"/>
  <line x1="566.0" y1="122.0" x2="566.0" y2="168.0" stroke="#334155" stroke-width="1.4"/>
  <text x="533.0" y="151.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">30</text>
  <text x="588.0" y="150.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">None</text>
  <text x="143.0" y="188.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">value</text>
  <text x="198.0" y="188.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">next</text>
  <text x="360.0" y="210.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">delete(20): the node before it skips over it</text>
  <rect x="110.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.6"/>
  <line x1="176.0" y1="262.0" x2="176.0" y2="308.0" stroke="#334155" stroke-width="1.4"/>
  <text x="143.0" y="291.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">10</text>
  <rect x="305.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="371.0" y1="262.0" x2="371.0" y2="308.0" stroke="#334155" stroke-width="1.4"/>
  <text x="338.0" y="291.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">20</text>
  <rect x="500.0" y="262.0" width="110.0" height="46.0" rx="6" fill="#0f172a" stroke="#6ee7b7" stroke-width="1.6"/>
  <line x1="566.0" y1="262.0" x2="566.0" y2="308.0" stroke="#334155" stroke-width="1.4"/>
  <text x="533.0" y="291.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">30</text>
  <text x="588.0" y="290.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">None</text>
  <path d="M 198 285 C 198 238, 510 238, 510 259" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="198.0" cy="285.0" r="4" fill="#4ade80" fill-opacity="1" stroke="#6ee7b7" stroke-width="2"/>
  <line x1="393.0" y1="285.0" x2="496.0" y2="285.0" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="360.0" y="358.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">cur.next = cur.next.next. Insert at the head is O(1); reading item i needs a</text>
  <text x="360.0" y="374.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">walk, O(n).</text>
</svg>
