  <line x1="488.0" y1="194.0" x2="592.0" y2="133.0" stroke="#fdba74" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="70.0" cy="122.0" r="12" fill="#0f172a" fill-opacity="1" stroke="#fdba74" stroke-width="2"/>
