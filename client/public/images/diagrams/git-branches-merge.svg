  <text x="40.0" y="127.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#fdba74" text-anchor="end">main</text>
  <text x="228.0" y="207.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#4ade80" text-anchor="end">login</text>
  <text x="600.0" y="100.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">merge commit</text>
  <text x="110.0" y="196.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">git switch -c login</text>
  <text x="560.0" y="232.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="middle">git merge login</text>
  <text x="360.0" y="252.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">A branch is a movable pointer to a commit. Work on login stays separate until</text>
  <text x="360.0" y="268.9" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">you merge it into main.</text>
