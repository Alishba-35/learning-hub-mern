  <text x="145.0" y="127.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">B</text>
  <text x="105.0" y="188.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">INNER JOIN</text>
  <clipPath id="c1"><circle cx="253.0" cy="122" r="40"/></clipPath>
