  <text x="152.8" y="209.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">17 &gt; 5</text>
  <rect x="275.6" y="188.0" width="107.4" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="209.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">1</text>
  <rect x="383.0" y="188.0" width="307.0" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="536.5" y="209.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">true is 1</text>
  <rect x="30.0" y="220.0" width="245.6" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="152.8" y="241.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">17 &lt; 5</text>
  <rect x="275.6" y="220.0" width="107.4" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="241.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">0</text>
  <rect x="383.0" y="220.0" width="307.0" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="536.5" y="241.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">false is 0</text>
  <rect x="30.0" y="252.0" width="245.6" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="152.8" y="273.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">a &gt; 3 &amp;&amp; b &gt; 9</text>
  <rect x="275.6" y="252.0" width="107.4" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="273.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">0</text>
  <rect x="383.0" y="252.0" width="307.0" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="536.5" y="273.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">both must be true</text>
  <text x="360.0" y="310.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#94a3b8" text-anchor="middle">Use == to compare. A single = assigns a value.</text>
</svg>
