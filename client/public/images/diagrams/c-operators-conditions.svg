<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 349" width="720" height="349" role="img" aria-labelledby="t d">
  <title id="t">Operators and their results</title>
  <desc id="d">Table of C operators with examples where a is 17 and b is 5.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker></defs>
  <rect width="720" height="349" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="360.0" y="36.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#a5b4fc" text-anchor="middle">Operators and their results</text>
  <rect x="30.0" y="60.0" width="245.6" height="32.0" rx="0" fill="#a5b4fc" stroke="#a5b4fc" stroke-width="1"/>
  <text x="152.8" y="81.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Expression</text>
  <rect x="275.6" y="60.0" width="107.4" height="32.0" rx="0" fill="#a5b4fc" stroke="#a5b4fc" stroke-width="1"/>
  <text x="329.3" y="81.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Result</text>
  <rect x="383.0" y="60.0" width="307.0" height="32.0" rx="0" fill="#a5b4fc" stroke="#a5b4fc" stroke-width="1"/>
  <text x="536.5" y="81.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Why</text>
  <rect x="30.0" y="92.0" width="245.6" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="152.8" y="113.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">17 / 5</text>
  <rect x="275.6" y="92.0" width="107.4" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="113.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">3</text>
  <rect x="383.0" y="92.0" width="307.0" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="536.5" y="113.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">int division drops decimals</text>
  <rect x="30.0" y="124.0" width="245.6" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="152.8" y="145.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">17 % 5</text>
  <rect x="275.6" y="124.0" width="107.4" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="145.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">2</text>
  <rect x="383.0" y="124.0" width="307.0" height="32.0" rx="0" fill="#162033" stroke="#334155" stroke-width="1"/>
  <text x="536.5" y="145.0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">remainder</text>
  <rect x="30.0" y="156.0" width="245.6" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="152.8" y="177.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">(double)17 / 5</text>
  <rect x="275.6" y="156.0" width="107.4" height="32.0" rx="0" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="329.3" y="177.0" font-family="Consolas, 'Fira Code', 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#e2e8f0" text-anchor="middle">3.4</text>
